<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BxA Automotive{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script defer src="{{ url_for('static', filename='cart.js') }}"></script></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="shell bar"><a class="brand" href="{{ url_for('catalog') }}">BxA <small>Bavaira x Affalterbach</small></a>
<nav aria-label="Main"><a href="{{ url_for('catalog') }}">Catalogue</a><a href="{{ url_for('view_cart') }}">Cart <span id="cart-count">{{ cart_count }}</span></a></nav></div></header>
<main class="shell" id="main">
{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
{% block body %}{% endblock %}
</main><footer class="shell">BxA Automotive · Educational prototype · USD sample prices</footer>
</body></html>
